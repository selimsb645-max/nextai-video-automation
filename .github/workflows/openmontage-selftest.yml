name: OpenMontage selftest

# OpenMontage-এর ffmpeg-ভিত্তিক টুলগুলো আমাদের পাইপলাইনে সত্যিই কাজ করে কি না,
# সেটা প্রমাণ করার ছোট রান। কোনো API key বা GPU লাগে না, খরচ শূন্য।
on:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install our deps
        run: pip install -r requirements.txt
      - name: Install OpenMontage
        run: |
          pip install "git+https://github.com/OpenMontageInc/OpenMontage.git#egg=openmontage"
      - name: Make a test clip
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -y -f lavfi -i "testsrc=size=1280x720:rate=25:duration=6" \
                 -f lavfi -i "sine=frequency=440:duration=6" \
                 -c:v libx264 -pix_fmt yuv420p -c:a aac /tmp/test16x9.mp4 -loglevel error
      - name: Run the bridge
        run: |
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, '.')
          from factory import om_bridge as om

          print('available:', json.dumps(om.available()))
          print('probe in :', om.probe('/tmp/test16x9.mp4'))
          print('scenes   :', om.detect_scenes('/tmp/test16x9.mp4'))
          ref = om.reframe_vertical('/tmp/test16x9.mp4', '/tmp/out9x16.mp4')
          print('reframe  :', ref)
          print('probe out:', om.probe('/tmp/out9x16.mp4'))
          assert om.probe('/tmp/out9x16.mp4')['height'] == 1920, 'reframe failed'
          print('SELFTEST OK')
          PY
