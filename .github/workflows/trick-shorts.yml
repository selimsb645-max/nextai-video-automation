name: Wildlife Trick Shorts

# Owner request 2026-11-14: the "dead bird trick" format (a bird fakes death,
# waits for a fish, then strikes) becomes a daily Short.
#
# The AI-generated version needs Muse AI / Google Flow by hand (no API), so this
# producer builds the machine version unattended: real free wildlife footage
# (Pixabay licence) + 5-beat deception story + Kokoro narration + burned
# captions -> 1080x1920 Short, scheduled into the next free BD slot.
# The paste-ready master prompts stay in factory/trick_library.json.
#
# Manual: Actions -> "Wildlife Trick Shorts" -> Run workflow
#   mode = selftest  -> full render, never uploads
#   mode = produce   -> renders and schedules a real Short

on:
  schedule:
    - cron: "0 9 * * *"        # 15:00 BD daily; books the 18:30 BD slot
  workflow_dispatch:
    inputs:
      mode:
        description: "produce or selftest"
        default: "produce"
      trick:
        description: "optional trick id (e.g. trick_octopus_rock)"
        default: ""

permissions:
  contents: write

concurrency:
  group: trick-shorts
  cancel-in-progress: false

jobs:
  trick:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -q kokoro-onnx soundfile numpy pillow edge-tts
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          command -v ffmpeg && ffmpeg -version | head -1

      - name: Cache shared Kokoro voice model
        id: kokoro-cache
        uses: actions/cache@v4
        with:
          path: factory/tts_kokoro
          key: kokoro-tts-v1

      - name: Restore Kokoro voice model (repo release asset)
        if: steps.kokoro-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          python3 - <<'PY'
          import json, os, urllib.request
          slug = os.environ["GITHUB_REPOSITORY"]
          tok = os.environ["GH_TOKEN"]
          def get(url):
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + tok})
              return urllib.request.urlopen(req, timeout=120)
          rels = json.load(get(f"https://api.github.com/repos/{slug}/releases"))
          rel = next(r for r in rels
                     if any(a["name"] == "nextai-runtime-assets.tar.gz" for a in r.get("assets", [])))
          a = next(a for a in rel["assets"] if a["name"] == "nextai-runtime-assets.tar.gz")
          req = urllib.request.Request(a["url"], headers={
              "Authorization": "Bearer " + tok,
              "Accept": "application/octet-stream"})
          with urllib.request.urlopen(req, timeout=1800) as r, open("assets.tar.gz", "wb") as f:
              while True:
                  chunk = r.read(1 << 22)
                  if not chunk:
                      break
                  f.write(chunk)
          print("downloaded", os.path.getsize("assets.tar.gz"), "bytes")
          PY
          tar -xzf assets.tar.gz -C "$GITHUB_WORKSPACE" factory/tts_kokoro
          rm -f assets.tar.gz
          ls -la factory/tts_kokoro/

      - name: Produce the trick Short
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          KOKORO_VOICE: af_heart
        run: |
          set -e
          mkdir -p yt-auth
          printf '%s' "$YT_TOKEN_JSON" > yt-auth/token_nextai.json
          MODE="${{ github.event.inputs.mode || 'produce' }}"
          TRICK="${{ github.event.inputs.trick || '' }}"
          if [ "$MODE" = "selftest" ]; then
            python3 factory/trick_shorts.py --selftest ${TRICK:+--trick "$TRICK"}
          else
            python3 factory/trick_shorts.py ${TRICK:+--trick "$TRICK"}
          fi

      - name: Commit state (so the same trick never repeats)
        if: always()
        run: |
          git config user.name "trick-shorts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add factory/trick_state.json factory/footage/_trick_used.json \
                  factory/published_log.json factory/state.json \
                  actions/reports/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no state change to commit"
          else
            git commit -m "trick-shorts: state $(date -u +%Y-%m-%dT%H:%M)"
            git push
          fi

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trick-short
          path: |
            actions/reports/
            factory/trick_state.json
            factory/runs/*/final.mp4
            factory/runs/*/thumb.jpg
          if-no-files-found: ignore
          retention-days: 7
